app:
  name: "OFICINA MECANICA"

paths:
  log_path: "logs/sistema.log"

logging:
  version: 1

  formatters:
    detailed:
      format: "%(asctime)s.%(msecs)03d - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"

  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: detailed
      stream: ext://sys.stdout

    file:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: detailed
      filename: sistema.log
      maxBytes: 5242880
      backupCount: 5
      encoding: utf-8

  loggers:
    app:  # o nome real do logger vem de app.name (veja logging_config.py)
      level: DEBUG
      handlers:
        - console
        - file
      propagate: false

    sqlalchemy.engine:
      level: WARNING
      handlers:
        - file
      propagate: false

  root:
    level: WARNING
    handlers:
      - console