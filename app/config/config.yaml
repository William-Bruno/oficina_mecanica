app:
  name: "OFICINA MECANICA"

paths:
  log_sistema_path: "logs/sistema/app.log"
  log_banco_path: "logs/banco/sqlalchemy.log"

logging:
  version: 1

  formatters:
    detailed:
      format: "%(asctime)s.%(msecs)03d - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"

  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: detailed
      stream: ext://sys.stdout

    file_sistema:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: detailed
      filename: app.log
      maxBytes: 5242880
      backupCount: 5
      encoding: utf-8
    
    file_banco:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: detailed
      filename: sqlalchemy.log
      maxBytes: 5242880
      backupCount: 5
      encoding: utf-8


  loggers:
    app:  # o nome real do logger vem de app.name (veja logging_config.py)
      level: DEBUG
      handlers:
        - console
        - file_sistema
      propagate: false

    sqlalchemy:
      level: WARNING
      handlers: []
      propagate: false

    sqlalchemy.engine.Engine:
      level: INFO
      handlers:
        - file_banco
      propagate: false

  root:
    level: WARNING
    handlers:
      - console